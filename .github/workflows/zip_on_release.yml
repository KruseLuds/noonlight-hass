name: Create Zip on Release
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  create_zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.1
      - name: Debug Variables
        run: |
            echo "github.event_name: ${{ github.event_name }}"
            echo "github.ref_name: ${{ github.ref_name }}"
            echo "github.event.repository.default_branch: ${{ github.event.repository.default_branch }}"
            echo "github.event.release.target_commitish: ${{ github.event.release.target_commitish }}"
            echo "github.event.release.prerelease: ${{ github.event.release.prerelease }}"
            echo "github.event.release.draft: ${{ github.event.release.draft }}"      
      - name: Verify committed version matches tag
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path
          import re

          manifest = json.loads(Path('custom_components/noonlight/manifest.json').read_text())
          constants = Path('custom_components/noonlight/const.py').read_text()
          version = manifest['version']
          tag = os.environ['RELEASE_TAG']
          assert tag == f'v{version}', f'Release {tag} does not match manifest {version}'
          assert re.search(r'^VERSION = ["\']' + re.escape(tag) + r'["\']$', constants, re.M), 'const.py version mismatch'
          print('Source version verified:', tag)
          PYVERIFY
      - name: Create Zip
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'noonlight.zip'
          directory: ./custom_components/noonlight
      - name: Upload Zip to Release
        if: ${{ github.event_name == 'release' }}
        uses: Roang-zero1/github-upload-release-artifacts-action@v3.0.0
        with:
          args: ./custom_components/noonlight/noonlight.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Zip to Action
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: noonlight
          path: ./custom_components/noonlight/noonlight.zip
          if-no-files-found: error
